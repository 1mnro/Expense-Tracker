<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body class="bg-body-tertiary">
    <header>
      <nav class="navbar bg-dark">
        <div class="container-fluid">
          <span class="navbar-brand m-2 h1 text-light">Expense Tracker</span>
          <button id="theme-toggle" class="btn btn-outline-light">
            <i class="fa-solid fa-circle-half-stroke"></i>
          </button>
        </div>
      </nav>
    </header>
    <main class="container-fluid my-4">
      <div id="alert-container"></div>

      <div class="summary-grid mb-4">
        <div class="card text-center">
          <div class="card-body">
            <div class="text-muted">Total</div>
            <div class="fs-2 fw-bold" id="total">0.00</div>
          </div>
        </div>

        <div class="card text-center">
          <div class="card-body">
            <div class="text-muted">Number of expenses</div>
            <div class="fs-2 fw-bold" id="count">0</div>
          </div>
        </div>

        <div class="card text-center">
          <div class="card-body">
            <div class="text-muted">Highest expense</div>
            <div class="fs-2 fw-bold" id="highest">0.00</div>
            <div class="text-muted" id="highest-name">-</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h5 class="card-title mb-3">Add expense</h5>
          <form id="expense-form" novalidate>
            <div class="row g-4">
              <div class="col-md-4">
                <label for="title" class="form-label"> Title</label>
                <input type="text" id="title" class="form-control" required />
                <div class="invalid-feedback">Title is required</div>
              </div>

              <div class="col-md-2">
                <label for="amount" class="form-label">Amount</label>
                <input
                  type="number"
                  id="amount"
                  class="form-control"
                  step="0.01"
                  required
                />
                <div class="invalid-feedback">
                  Enter an amount greater than 0
                </div>
              </div>

              <div class="col-md-3">
                <label for="category" class="form-label">Category</label>
                <select id="category" class="form-select" required>
                  <option value="" selected disabled>Choose..</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
                <div class="invalid-feedback">Choose a category</div>
              </div>

              <div class="col-md-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" id="date" class="form-control" required />
                <div class="invalid-feedback">Pick a date.</div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">
              Add expense
            </button>
          </form>
        </div>
      </div>

      <div class="card mt-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">Expenses</h5>
            <div class="d-flex align-items-center gap-2">
              <button id="export-btn" type="button" class="btn btn-outline-secondary btn-sm">
                Export CSV
              </button>
              <label for="filter" class="form-label mb-0">Category</label>
              <select id="filter" class="form-select w-auto">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div id="spinner" class="text-center my-4 d-none">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">Title</th>
                  <th scope="col" class="text-end">Amount</th>
                  <th scope="col">Category</th>
                  <th scope="col">Date</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="expense-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer></footer>

    <!-- the modal for editing an expense -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="edit-form" novalidate>
            <div class="modal-header">
              <h5 class="modal-title">Edit expense</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="edit-id" />
              <!-- we need the id of the expense to edit it in the backend -->

              <div class="mb-3">
                <label for="edit-title" class="form-label">Title</label>
                <input type="text" id="edit-title" class="form-control" />
                <div class="invalid-feedback">Title is required</div>
              </div>

              <div class="mb-3">
                <label for="edit-amount" class="form-label">Amount</label>
                <input
                  type="number"
                  id="edit-amount"
                  class="form-control"
                  step="0.01"
                />
                <div class="invalid-feedback">
                  Enter an amount greater than 0
                </div>
              </div>

              <div class="mb-3">
                <label for="edit-category" class="form-label">Category</label>
                <select id="edit-category" class="form-select">
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="edit-date" class="form-label">Date</label>
                <input type="date" id="edit-date" class="form-control" />
                <div class="invalid-feedback">Pick a date.</div>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Save changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
